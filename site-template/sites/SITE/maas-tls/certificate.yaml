# Tenants call https://maas.APPS_DOMAIN. OpenShift points that name at the MaaS
# gateway's own load balancer, so the gateway must present a certificate tenants
# trust, and only a DNS-01 issuer can issue it. A certificate of its own, not the
# router's wildcard, so browsers don't reuse one connection across hosts.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: maas-gateway-public
  namespace: openshift-ingress
spec:
  secretName: maas-gateway-public-tls
  dnsNames:
    - maas.APPS_DOMAIN
  issuerRef:
    kind: ClusterIssuer
    name: DNS01_ISSUER
