# Your deployment's inputs: the values that name your repositories and your
# tenant IdP. scripts/set-inputs.sh fills the REQUIRED- ones (install guide,
# page 2); check-deployment.sh names any left. Change only the value after
# each &name.
#
# This file is yours: the template never changes it, so moving the library pin
# in kustomization.yaml (make update) never conflicts with your values. It's a
# patch on the root ApplicationSet, applied after kustomization.yaml's, that
# replaces the placeholders there in both generators' values, and the own-apps
# generator's repository and revision.
# Reference: the library's docs/install/appendix-a-inputs.md ("Inputs").
- op: replace
  path: /spec/generators/0/git/values/deploymentRepoURL
  value: &deploymentRepoURL REQUIRED-deploymentRepoURL
- op: replace
  path: /spec/generators/0/git/values/deploymentRevision
  value: &deploymentRevision main
- op: replace
  path: /spec/generators/0/git/values/catalogRepoURL
  value: &catalogRepoURL REQUIRED-catalogRepoURL
- op: replace
  path: /spec/generators/0/git/values/catalogRevision
  value: &catalogRevision main
- op: replace
  path: /spec/generators/0/git/values/idpIssuerURL
  value: &idpIssuerURL REQUIRED-idpIssuerURL

# The same values on this deployment's own apps generator (generators/1).
- { op: replace, path: /spec/generators/1/git/repoURL, value: *deploymentRepoURL }
- { op: replace, path: /spec/generators/1/git/revision, value: *deploymentRevision }
- { op: replace, path: /spec/generators/1/git/values/deploymentRepoURL, value: *deploymentRepoURL }
- { op: replace, path: /spec/generators/1/git/values/deploymentRevision, value: *deploymentRevision }
- { op: replace, path: /spec/generators/1/git/values/catalogRepoURL, value: *catalogRepoURL }
- { op: replace, path: /spec/generators/1/git/values/catalogRevision, value: *catalogRevision }
- { op: replace, path: /spec/generators/1/git/values/idpIssuerURL, value: *idpIssuerURL }
