# deployment-root: syncs root/ from this repository, so the root ApplicationSet
# follows git after bootstrap-hub.sh applies it once. Its repoURL and
# targetRevision come from inputs.env (kustomization.yaml). No pruning:
# removing the root must never cascade to the hub's components.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deployment-root
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/cfchase/ai-grid-deployment-uat.git
    targetRevision: main
    path: root
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
