# The hub's root: the library's components at a pinned commit, with this
# deployment's selection and inputs. deployment-root (self.yaml) syncs this
# directory, so a commit here (a selection change, a new pin) reaches the hub.
# Reference: the library's docs/install/appendix-a-inputs.md ("Your root").
#
# Your inputs (your repositories and tenant IdP) are in inputs.env, not here:
# scripts/set-inputs.sh writes that file (install guide, page 2), and the
# replacements at the end copy its values over the REQUIRED- placeholders below,
# so leave them. This file comes from the template, and make update brings its
# changes; the template has no inputs.env, so an update never touches yours.
# To upgrade the library, change the SHA in all three places (the remote base,
# the generator revision and values.libraryRevision) in one commit.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Git form, not a raw URL: raw.githubusercontent.com caches a new commit as 404
  # for minutes.
  - https://github.com/ai-grid-cloud/ai-grid-cluster-gitops//bootstrap/hub?ref=ee0eb3755609a93ff305ea3e1278bee8c96301f3
  - self.yaml
patches:
  - target: { group: argoproj.io, kind: ApplicationSet, name: apps }
    patch: |
      # "test" ops fail the render if the library moves a field this patch relies on.
      - { op: test, path: /spec/generators/0/git/repoURL, value: REQUIRED-libraryRepoURL }
      - { op: replace, path: /spec/generators/0/git/repoURL, value: &libraryRepoURL https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git }
      - { op: test, path: /spec/generators/0/git/revision, value: REQUIRED-libraryRevision }
      - { op: replace, path: /spec/generators/0/git/revision, value: &libraryRevision ee0eb3755609a93ff305ea3e1278bee8c96301f3 }
      # The components this hub runs, by hub item. Reference for each item:
      # the library's docs/install/hub/0N-*.md; to change one, see "Select
      # components" in docs/install/hub/README.md.
      - op: replace
        path: /spec/generators/0/git/files
        value:
          # 0. Platform services (hub/00-platform-services.md); cert-manager is the platform's.
          - path: apps/gitops-config/application.yaml
          - path: cluster-config/application.yaml
          - path: apps/external-secrets/application.yaml
          # 1. ACM, the multicluster engine and Submariner (hub/01-acm.md), with ODF
          #    object storage (Multicloud Object Gateway only); the ODF operator
          #    itself is generator 1, kept below.
          - path: apps/acm/application.yaml
          - path: apps/object-storage/odf/application.yaml
          # 2. Grid (hub/02-grid.md).
          - path: apps/grid-bootstrap/application.yaml
          - path: apps/ai-grid-policies/application.yaml
          # 3. MaaS shared services (hub/03-maas-shared-services.md), on the hub;
          #    apps/external-services, which runs them on a labelled site instead, is left out.
          - path: apps/maas-db/application.yaml
          - path: apps/limitador-redis/application.yaml
          # 4. Tenant identity (hub/04-tenant-identity.md): none here; this
          #    deployment's own Keycloak is apps/tenant-idp.yaml.
          # 5. Provider console and model delivery (hub/05-console-and-model-delivery.md).
          - path: apps/acm-models/application.yaml
          - path: apps/console/application.yaml
          # 6. Site delivery (hub/06-site-delivery.md).
          - path: apps/ai-grid-spokes/application.yaml
          - path: apps/argo-registration/application.yaml
          - path: apps/rhoai/application.yaml
          - path: apps/rhoai-prerequisites/application.yaml
          # 7. Observability and usage logs (hub/07-observability.md): on.
          - path: bootstrap/hub/components/ai-grid-o11y.yaml
          - path: apps/ai-grid-usage-logs/application.yaml
      - op: replace
        path: /spec/generators/0/git/values
        value: &inputs
          libraryRepoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
          libraryRevision: ee0eb3755609a93ff305ea3e1278bee8c96301f3
          deploymentRepoURL: &deploymentRepoURL REQUIRED-deploymentRepoURL
          deploymentRevision: &deploymentRevision main
          catalogRepoURL: REQUIRED-catalogRepoURL
          catalogRevision: main
          idpIssuerURL: REQUIRED-idpIssuerURL
          idpClientID: ai-grid-tenants
          idpClientSecretNamespace: tenant-idp-client
          idpClientSecretName: tenant-idp-client
          idpClientSecretKey: client-secret
          idpCANamespace: openshift-config-managed
          idpCAName: default-ingress-cert
          idpCAKey: ca-bundle.crt
      # ODF (generator 1): the operator, which ODF object storage above needs. Its
      # repository and revision reuse the two values set for generator 0 above
      # (aliases), so the pin stays in three places.
      - { op: test, path: /spec/generators/1/matrix/generators/0/git/repoURL, value: REQUIRED-libraryRepoURL }
      - { op: replace, path: /spec/generators/1/matrix/generators/0/git/repoURL, value: *libraryRepoURL }
      - { op: test, path: /spec/generators/1/matrix/generators/0/git/revision, value: REQUIRED-libraryRevision }
      - { op: replace, path: /spec/generators/1/matrix/generators/0/git/revision, value: *libraryRevision }
      - { op: test, path: /spec/generators/1/matrix/generators/0/git/files/0/path, value: apps/odf/application.yaml }
      - op: replace
        path: /spec/generators/1/matrix/generators/0/git/values
        value: *inputs
      # This deployment's own apps: one Application per apps/*.yaml here. The
      # library's templatePatch needs the same values on every generator.
      - op: add
        path: /spec/generators/-
        value:
          git:
            # Generator fields can't take @inputs@; these aliases reuse the
            # deploymentRepoURL and deploymentRevision values set above.
            repoURL: *deploymentRepoURL
            revision: *deploymentRevision
            files:
              - path: apps/*.yaml
            values: *inputs
# Your inputs, from inputs.env. local-config keeps the ConfigMap out of the
# render; a missing inputs.env, or a name missing from it, fails the render.
configMapGenerator:
  - name: deployment-inputs
    envs: [inputs.env]
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"
# Each input into every generator's values (0, ODF's 1, and the own-apps 2);
# the deployment repository and its revision also into the own-apps generator
# and deployment-root (self.yaml).
replacements:
  - source: { kind: ConfigMap, name: deployment-inputs, fieldPath: data.deploymentRepoURL }
    targets:
      - select: { group: argoproj.io, kind: ApplicationSet, name: apps }
        fieldPaths:
          - spec.generators.0.git.values.deploymentRepoURL
          - spec.generators.1.matrix.generators.0.git.values.deploymentRepoURL
          - spec.generators.2.git.values.deploymentRepoURL
          - spec.generators.2.git.repoURL
      - select: { group: argoproj.io, kind: Application, name: deployment-root }
        fieldPaths:
          - spec.source.repoURL
  - source: { kind: ConfigMap, name: deployment-inputs, fieldPath: data.deploymentRevision }
    targets:
      - select: { group: argoproj.io, kind: ApplicationSet, name: apps }
        fieldPaths:
          - spec.generators.0.git.values.deploymentRevision
          - spec.generators.1.matrix.generators.0.git.values.deploymentRevision
          - spec.generators.2.git.values.deploymentRevision
          - spec.generators.2.git.revision
      - select: { group: argoproj.io, kind: Application, name: deployment-root }
        fieldPaths:
          - spec.source.targetRevision
  - source: { kind: ConfigMap, name: deployment-inputs, fieldPath: data.catalogRepoURL }
    targets:
      - select: { group: argoproj.io, kind: ApplicationSet, name: apps }
        fieldPaths:
          - spec.generators.0.git.values.catalogRepoURL
          - spec.generators.1.matrix.generators.0.git.values.catalogRepoURL
          - spec.generators.2.git.values.catalogRepoURL
  - source: { kind: ConfigMap, name: deployment-inputs, fieldPath: data.catalogRevision }
    targets:
      - select: { group: argoproj.io, kind: ApplicationSet, name: apps }
        fieldPaths:
          - spec.generators.0.git.values.catalogRevision
          - spec.generators.1.matrix.generators.0.git.values.catalogRevision
          - spec.generators.2.git.values.catalogRevision
  - source: { kind: ConfigMap, name: deployment-inputs, fieldPath: data.idpIssuerURL }
    targets:
      - select: { group: argoproj.io, kind: ApplicationSet, name: apps }
        fieldPaths:
          - spec.generators.0.git.values.idpIssuerURL
          - spec.generators.1.matrix.generators.0.git.values.idpIssuerURL
          - spec.generators.2.git.values.idpIssuerURL
