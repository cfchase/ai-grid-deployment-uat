# Adapted from ai-grid-cluster-gitops apps/keycloak/base/manifests/public-url-policy.yaml@60578f5
# (Apache-2.0), plus the ManagedClusterSetBinding pattern from
# apps/maas-db/hub/01-managed-cluster-set-binding.yaml@60578f5.
#
# OpenShift assigns the Route's host, so git can't hold Keycloak's public URL.
# An ACM Policy on the hub looks the Route up with a hub template and writes
# its host into ConfigMap tenant-idp-public-url, which sets KC_HOSTNAME. The
# issuer is then https://<route host>/realms/tenants whichever way Keycloak is
# reached.
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: global
  namespace: tenant-idp
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  clusterSet: global
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-public-url-templating
  namespace: tenant-idp
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-public-url-templating
  namespace: tenant-idp
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    resourceNames:
      - keycloak
    verbs:
      - get
  # Hub templates watch what they look up.
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs:
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-public-url-templating
  namespace: tenant-idp
  annotations:
    argocd.argoproj.io/sync-wave: "3"
subjects:
  - kind: ServiceAccount
    name: keycloak-public-url-templating
    namespace: tenant-idp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keycloak-public-url-templating
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: tenant-idp-public-url-clusters
  namespace: tenant-idp
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  clusterSets:
    - global
  # Only the hub, where Keycloak runs. ACM labels the hub's ManagedCluster
  # local-cluster=true, whatever its name.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            local-cluster: "true"
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: tenant-idp-public-url
  namespace: tenant-idp
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  remediationAction: enforce
  disabled: false
  hubTemplateOptions:
    serviceAccountName: keycloak-public-url-templating
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: tenant-idp-public-url
        spec:
          remediationAction: enforce
          severity: high
          namespaceSelector:
            include:
              - tenant-idp
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: tenant-idp-public-url
                  namespace: tenant-idp
                data:
                  KEYCLOAK_PUBLIC_URL: '{{hub printf "https://%s" (index (lookup "route.openshift.io/v1" "Route" "tenant-idp" "keycloak").status.ingress 0).host hub}}'
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: tenant-idp-public-url
  namespace: tenant-idp
  annotations:
    argocd.argoproj.io/sync-wave: "4"
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: tenant-idp-public-url-clusters
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: tenant-idp-public-url
