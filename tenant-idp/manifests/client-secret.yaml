# Adapted from ai-grid-cluster-gitops apps/keycloak/base/manifests/secrets.yaml@60578f5
# (Apache-2.0): Password generator and CreatedOnce ExternalSecret pattern.
#
# The tenant client's secret is generated once in tenant-idp-client, the
# namespace the library's hub templates read (input idpClientSecretNamespace).
# Keycloak in tenant-idp reads the same value through a kubernetes-provider
# SecretStore whose ServiceAccount may `get` only that one Secret.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: tenant-idp-client-secret
  namespace: tenant-idp-client
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tenant-idp-client
  namespace: tenant-idp-client
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # Generated once and never rotated: Keycloak imports the realm only when it
  # doesn't exist, so a new value would no longer match the client.
  refreshPolicy: CreatedOnce
  refreshInterval: 0s
  target:
    name: tenant-idp-client
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: tenant-idp-client-secret
      rewrite:
        - regexp:
            source: ^password$
            target: client-secret
---
# The SecretStore's identity. ESO requests a token for it (the ESO controller
# holds serviceaccounts/token create), then uses that token against the API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-idp-client-reader
  namespace: tenant-idp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# The minimum the kubernetes provider needs: GetSecret is a single `get` by
# name, and the store's validation passes on a SelfSubjectRulesReview rule with
# `get` on secrets (resourceNames aren't checked). SelfSubjectRulesReview
# itself is open to every authenticated user, so no rule is needed for it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-idp-client-reader
  namespace: tenant-idp-client
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - tenant-idp-client
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-idp-client-reader
  namespace: tenant-idp-client
  annotations:
    argocd.argoproj.io/sync-wave: "0"
subjects:
  - kind: ServiceAccount
    name: tenant-idp-client-reader
    namespace: tenant-idp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tenant-idp-client-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: tenant-idp-client
  namespace: tenant-idp
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    kubernetes:
      remoteNamespace: tenant-idp-client
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: tenant-idp-client-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-client
  namespace: tenant-idp
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: tenant-idp-client
  target:
    name: keycloak-client
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-secret
      remoteRef:
        key: tenant-idp-client
        property: client-secret
        # ESO's defaults, stated so Argo CD doesn't report drift.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
