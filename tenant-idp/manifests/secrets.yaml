# Adapted from ai-grid-cluster-gitops apps/keycloak/base/manifests/secrets.yaml@60578f5
# (Apache-2.0): only the bootstrap admin is kept. The provider console's
# create-secrets.sh reads KC_BOOTSTRAP_ADMIN_USERNAME and
# KC_BOOTSTRAP_ADMIN_PASSWORD from this Secret (KEYCLOAK_NAMESPACE=tenant-idp).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: keycloak-admin-password
  namespace: tenant-idp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-secrets
  namespace: tenant-idp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # Keycloak applies the bootstrap admin only when it first creates the master
  # realm, so the password is generated once and never rotated.
  refreshPolicy: CreatedOnce
  refreshInterval: 0s
  target:
    name: keycloak-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      mergePolicy: Merge
      data:
        KC_BOOTSTRAP_ADMIN_USERNAME: admin
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: keycloak-admin-password
      rewrite:
        - regexp:
            source: ^password$
            target: KC_BOOTSTRAP_ADMIN_PASSWORD
